name: Update reimbursement database

on:
  workflow_dispatch:
    inputs:
      allow_pipeline_transition:
        description: "Baseline came from a different pipeline/source (e.g. PDF-based reimbursement-v4)"
        type: boolean
        default: false
      allow_same_source_date:
        description: "Rebuild from a workbook whose register date is not newer than the published one"
        type: boolean
        default: false
      allow_missing_baseline:
        description: "No previous release exists at all (never use to bypass a failed baseline download)"
        type: boolean
        default: false

concurrency:
  group: reimbursement-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-reimbursement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pipeline tests
        run: python -m unittest discover -s tests -t .

      - name: Download previous release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/latest"
          release_json="$RUNNER_TEMP/latest/latest-release.json"
          http_code=$(curl -sS -o "$release_json" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest")
          highest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '[.[].tagName | select(test("^reimbursement-v[0-9]+$")) | capture("^reimbursement-v(?<n>[0-9]+)$").n | tonumber] | max // 0')
          echo "MINIMUM_DATABASE_VERSION=$highest" >> "$GITHUB_ENV"
          echo "Highest existing reimbursement release version: $highest"

          if [ "$http_code" = "404" ]; then
            echo "No release marked latest for this repository"
            exit 0
          fi
          if [ "$http_code" != "200" ]; then
            cat "$release_json" >&2
            echo "Failed to fetch latest GitHub Release (HTTP $http_code)" >&2
            exit 1
          fi

          manifest_url=$(jq -r '.assets[] | select(.name == "reimbursement_manifest.json") | .browser_download_url' "$release_json" | head -n 1)
          zip_url=$(jq -r '.assets[] | select(.name == "reimbursement.zip" or .name == "reimbursement.sqlite.zip") | .browser_download_url' "$release_json" | head -n 1)
          if [ -z "$manifest_url" ] || [ "$manifest_url" = "null" ] || [ -z "$zip_url" ] || [ "$zip_url" = "null" ]; then
            echo "Latest release is missing reimbursement baseline assets" >&2
            exit 1
          fi

          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$manifest_url" \
            -o "$RUNNER_TEMP/latest/reimbursement_manifest.json"
          zip_name=$(basename "${zip_url%%\?*}")
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$zip_url" \
            -o "$RUNNER_TEMP/latest/$zip_name"
          if [ -f "$RUNNER_TEMP/latest/reimbursement.zip" ]; then
            echo "PREVIOUS_ZIP=$RUNNER_TEMP/latest/reimbursement.zip" >> "$GITHUB_ENV"
          elif [ -f "$RUNNER_TEMP/latest/reimbursement.sqlite.zip" ]; then
            echo "PREVIOUS_ZIP=$RUNNER_TEMP/latest/reimbursement.sqlite.zip" >> "$GITHUB_ENV"
          fi
          if [ -f "$RUNNER_TEMP/latest/reimbursement_manifest.json" ]; then
            echo "PREVIOUS_MANIFEST=$RUNNER_TEMP/latest/reimbursement_manifest.json" >> "$GITHUB_ENV"
          fi

      - name: Build release assets
        env:
          ALLOW_PIPELINE_TRANSITION: ${{ inputs.allow_pipeline_transition }}
          ALLOW_SAME_SOURCE_DATE: ${{ inputs.allow_same_source_date }}
          ALLOW_MISSING_BASELINE: ${{ inputs.allow_missing_baseline }}
        run: |
          set -euo pipefail
          args=(--work-dir dist --repo "$GITHUB_REPOSITORY" --input-dir input/reimbursement)
          args+=(--minimum-database-version "${MINIMUM_DATABASE_VERSION:-0}")
          if [ -n "${PREVIOUS_MANIFEST:-}" ]; then
            args+=(--previous-manifest "$PREVIOUS_MANIFEST")
          fi
          if [ -n "${PREVIOUS_ZIP:-}" ]; then
            args+=(--previous-zip "$PREVIOUS_ZIP")
          fi
          if [ "${ALLOW_PIPELINE_TRANSITION}" = "true" ]; then
            args+=(--allow-pipeline-transition)
          fi
          if [ "${ALLOW_SAME_SOURCE_DATE}" = "true" ]; then
            args+=(--allow-same-source-date)
          fi
          if [ "${ALLOW_MISSING_BASELINE}" = "true" ]; then
            args+=(--allow-missing-baseline)
          fi
          python scripts/reimbursement/build_reimbursement_release.py "${args[@]}"

      - name: Print build summary
        run: |
          cat dist/build_summary.json

      - name: Upload reimbursement build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reimbursement-build-${{ github.run_number }}
          path: |
            dist/reimbursement.sqlite
            dist/reimbursement.zip
            dist/reimbursement_manifest.json
            dist/build_summary.json
          if-no-files-found: warn
